# Render Blueprint: one Node web service. Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: oasis-design
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && node scripts/prerender.mjs
    startCommand: node server/local.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OASIS_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OASIS_AGENT_MODEL
        value: claude-opus-5-5
